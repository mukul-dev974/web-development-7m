<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube videos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
       
      #carouselExample {
    width: 100%;
    margin: 0;
}

#carouselExample .carousel-item img {
    width: 100%;
    height: 300px;
    display: block;
    object-fit: fill;
   
}
        body{
            background-color: #151515;
            color: #ffff;
            padding: 20px;
        }

    
        .video-container{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }

        .video-card{
            width:33.33% ;
            
            border: 2px solid#aaa;
            border-radius: 10px;

            padding: 12px;
          display: flex;
          flex-direction: column;
          background-color: #151515;
          }

          .video-card img{
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
          }

          .watch-btn{
            display: block;
            width: 100%;
    padding: 8px;

    background-color: #4169a1;
    color: white;

    text-align: center;
    text-decoration: none;

    border: 2px solid #aaa;
    border-radius: 6px;

    font-size: 16px;
    font-weight: bold;

    transition: 0.3s;
          }

          .watch-btn:hover{
            background-color: #315486;
          }

          footer{
             height: 60px;

    border: 2px solid #aaa;
    border-radius: 10px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-top: 20px;

    font-size: 24px;
          }

          /* ===== RESPONSIVE ===== */

@media (max-width: 900px) {
    body {
        padding: 15px;
    }

    .video-container {
        flex-wrap: wrap;
    }

    .video-card {
        width: calc(50% - 10px);
    }

    footer {
        width: 100%;
        font-size: 20px;
    }
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    #carouselExample .carousel-item img {
        height: auto;
    }

    .video-container {
        flex-direction: column;
        gap: 15px;
    }

    .video-card {
        width: 100%;
    }

    .video-card img {
        height: auto;
    }

    footer {
        width: 100%;
        height: 50px;
        font-size: 16px;
        margin-top: 10px;
    }
}
     
    </style>
</head>
<body>
    <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://images.pexels.com/photos/879109/pexels-photo-879109.jpeg"
      
      class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://images.pexels.com/photos/13847596/pexels-photo-13847596.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://images.pexels.com/photos/18681382/pexels-photo-18681382.jpeg" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
    

<div class="video-container">
    <div class="video-card">
        <img src="../images/css assignment2img.webp" alt="">
       <a href="https://youtu.be/NkwFxeHARqc?si=JhwTWnOB6F-oCBof" class="watch-btn">watch now</a>
    </div>
    <div class="video-card">
        <img src="../images/css assignment2img.jpg" alt="">
       <a href="https://youtu.be/GxI087LMOSI?si=owjr-VBEXR8nkGHH" class="watch-btn">watch now</a>
    </div>
    <div class="video-card">
        <img src="../images/cssasgnm2img.jpg" alt="">
       <a href="https://youtu.be/4CXcK7f8FZE?si=oTAPdrSgJDrAmCYu" class="watch-btn">watch now</a>
    </div>
    </div>

    <footer>
        copyright-mukulkaushik
    </footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
