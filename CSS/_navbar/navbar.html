<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar variations</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #302e2e;
            color: #fff;

           }

           h2{
            color: #fff;
            text-align: left;
           }

           .nav-container{
            margin-bottom: 40px;
           }

           .nav1{
            background-color: #fff;
            padding: 10px;
           }
           .nav1 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
           }

           .nav1 li{
            display:inline
           }

           .nav1 a{
            /* background-color: #dd8a4f; */
            color: #202020;
            padding: 5px 15px;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
        }

        .nav1 a::after{
            content:"" ;
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #1414ff;
             transform: scaleX(0);
            transition: transform 0.3s ease-in-out ;
        }

        .nav1 a:hover::after{
            transform: scaleX(1);
            
        }

        .login-btn{
            background-color: #1414ff;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-inline: initial;
        }

        .nav2 {
            background-color: #036;
            padding: 20px;
            width: 200px;
           
           
        }

        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .nav2 li{
            margin-bottom: 12px;
        }

        .nav2 a{
            text-decoration: none;
            color: #fff;
            display: block;
            width: 100%;
            padding: 10px;
        }

        .nav2 a:hover{
            background-color: #0916a9;
        }

        .nav2 .Login-btn{
            background-color: #050e6d;
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            cursor: pointer;
           }

        .nav2 .Login-btn:hover{
            background-color: #453ff2;
            border: 1px solid #fff ;
        } 
        
        .nav3{
            background-color: #13b19a;
            padding: 10px;
        }

        .nav3 ul{
            list-style: none;
            padding: 0%;
            margin: 0%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav3 a{
            text-decoration: none;
            color: #fff;
            padding: 10px;
            display: block;
        }
        .nav3 a:hover {
    background-color: rgba(255, 255, 255, 0.3);
    color: #fff;
}

       .nav3 .dropdown-content {
    display: none;
}

.nav3 .dropdown:hover .dropdown-content {
    display: block;
    position: absolute;
    background-color: #464141;
    color: #302e2e;
    min-width: 150px;
}
.nav3 .dropdown-content li:hover {
    background-color: rgba(255, 255, 255, 0.3);
    color: #fff; 
}
    </style>
</head>
<body>
<div class="nav-container">
       <h2>Variation 1: Horizontal with undeline effect</h2>
       <nav class="nav1">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">products</a></li>
            <li><button class="login-btn">Login</button></li>
        </ul>
       </nav>
</div>
 

<div class="nav-container">
       <h2>Variation 2: Vertical with hover effect</h2>
       <nav class="nav2">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">products</a></li>
             </ul>
             <button class="Login-btn">Login</button>
       </nav>
</div>
    
<div class="nav-container">
       <h2>Variation 3: Horizontal with dropdown</h2>
       <nav class="nav3">
        <ul>
            <li><a href="#">Home</a></li>
            <li class="dropdown"><a href="#">About</a>
             <div class="dropdown-content">
                <a href="#">Our story</a><a href="#">Team</a><a href="#">Contact</a>
             </div>
             </li>
             <li><a href="#">Products</a></li>
             <li><button class="login-btn">Login</button></li>
            </ul>
            </nav>
</div>



</body>
</html>
