<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid masterclass</title>

    <style>

        .grid-container{
            display: grid;
            grid-template-columns: repeat(3, 1fr) ;
            grid-template-rows: 100px 200px 100px;
            gap: 10px;
        }
        .items{
            background-color: #f06161;
            border: 1px solid #000000;
            padding: 20px;
            text-align: center;
        }

        .item1{
            grid-column: 1/3;
            grid-row: 1/2;
        }
        .image1{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item2{
            grid-column:3/4;
            grid-row: 1/3;
        }

        .item6{
            grid-column: 2/4;
        }
    </style>

</head>
<body>
    <div class="grid-container">
        <div class="items item1"><img src="../images/pexels-lich-18198192.jpg" class="image1" alt=""></div>
        <div class="items item2">2</div>
        <div class="items">3</div>
        <div class="items">4</div>
        <div class="items">5</div>
        <div class="items item6">6</div>

    </div>
</body>
</html>
