<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up page</title>

    <style>
        body{
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height:95vh;
            padding: 0%;
            margin: 0%;
        }

        .card{
           background-color: rgb(12, 6, 6);
        width: 400px;
        padding: 20px;
        border-radius: 15px;
      margin-top: 1px;
        }

        .pass{
            display: flex;
            justify-content: center;
        }
        .pass>input{
            width: 200px;
          
        }

        .name-fields{
            display: flex;
            justify-content: row;
            gap: 10px;
        
        }
        .name-fields,input{
            width: 0
            200px; ;
        }

        h2{
            color: rgb(20, 225, 51);
            text-align: center;

        }

        form{
            display: flex;
            flex-direction: column;
           
        }
        input{
            width: 385px;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px #fff;
            background-color: #fff;
        }

        button{
            background-color: #9be04e;
            color: #fff;
            width: 150px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
        }
        .sign{
            display: flex;
            justify-content: center;
        }

        button:hover{
            background-color: rgb(20, 225, 51);
        }
            
        
    
    </style>
</head>
<body>
    <div class="card">
        
        <h2>sign up</h2>
        <form >
          
                  <input type="email" name="" id="" placeholder="Email">

          
      

        <div class="name-fields">
        <input type="first name" name="" id="" placeholder="First name">

        <input type="Last name " name="" id="" placeholder="Last name ">
        </div>

        <div class="pass">
            <input type="password" name="" id="" placeholder="password">

        </div>
        <div class="sign">
             <button type="submit">Sign up</button>
             </div>


        </div>
       
        </form>


    



    </div>
    
</body>
</html>
